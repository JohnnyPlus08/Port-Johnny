<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="50%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d9b8" />
      <stop offset="100%" stop-color="#e0b28e" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="url(#cyberCyan)" stroke-width="3"/>

  <!-- Background Circuit & Glow Rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.25"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

  <!-- Code Decor elements in background -->
  <text x="45" y="110" fill="#00d2ff" font-family="monospace" font-size="16" opacity="0.35">&lt;code&gt;</text>
  <text x="290" y="140" fill="#7928ca" font-family="monospace" font-size="16" opacity="0.45">&#123; tech &#125;</text>
  <text x="50" y="290" fill="#10b981" font-family="monospace" font-size="14" opacity="0.4">TCP/IP: OK</text>
  <text x="280" y="280" fill="#00d2ff" font-family="monospace" font-size="15" opacity="0.4">&lt;/dev&gt;</text>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Tech Hoodie -->
  <path d="M 80 395 C 85 305 130 260 200 260 C 270 260 315 305 320 395 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Hoodie Zipper / Cyber Accent -->
  <path d="M 200 260 L 200 395" stroke="url(#cyberCyan)" stroke-width="3" opacity="0.8"/>
  <path d="M 175 285 L 195 350 L 200 350" fill="none" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.4"/>
  <path d="M 225 285 L 205 350 L 200 350" fill="none" stroke="url(#cyberPurple)" stroke-width="2" opacity="0.4"/>

  <!-- Neck -->
  <rect x="180" y="210" width="40" height="60" rx="8" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M 180 235 C 190 250 210 250 220 235 L 220 250 L 180 250 Z" fill="#cf9d76" opacity="0.4"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="138" cy="185" rx="10" ry="18" fill="url(#skinGrad)"/>
  <ellipse cx="262" cy="185" rx="10" ry="18" fill="url(#skinGrad)"/>

  <!-- Modern Hair -->
  <path d="M 138 175 C 135 120 160 95 200 95 C 240 95 265 120 262 175 C 255 135 240 115 200 115 C 160 115 145 135 138 175 Z" fill="url(#hairGrad)"/>
  <path d="M 140 160 C 155 110 185 100 215 105 C 245 110 260 130 260 155 C 245 125 220 115 195 120 C 170 125 155 140 140 160 Z" fill="#1e293b"/>

  <!-- Stylish Glasses / Cyber Rim -->
  <rect x="150" y="165" width="40" height="28" rx="8" fill="rgba(0, 210, 255, 0.12)" stroke="url(#cyberCyan)" stroke-width="2.5"/>
  <rect x="210" y="165" width="40" height="28" rx="8" fill="rgba(0, 210, 255, 0.12)" stroke="url(#cyberCyan)" stroke-width="2.5"/>
  <!-- Glasses Bridge -->
  <path d="M 190 176 L 210 176" stroke="url(#cyberCyan)" stroke-width="2.5"/>
  <!-- Glasses Glare -->
  <line x1="155" y1="170" x2="168" y2="188" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="215" y1="170" x2="228" y2="188" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Eyes behind glasses -->
  <circle cx="170" cy="178" r="4" fill="#1e293b"/>
  <circle cx="230" cy="178" r="4" fill="#1e293b"/>
  <!-- Eyebrows -->
  <path d="M 152 158 Q 170 152 188 158" fill="none" stroke="#2d3748" stroke-width="3" stroke-linecap="round"/>
  <path d="M 212 158 Q 230 152 248 158" fill="none" stroke="#2d3748" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 196 182 L 194 200 L 204 200" fill="none" stroke="#cf9d76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Friendly Confident Smile -->
  <path d="M 184 218 Q 200 230 216 218" fill="none" stroke="#a06040" stroke-width="3" stroke-linecap="round"/>

  <!-- Beard / Goatee subtle tech style -->
  <path d="M 186 230 Q 200 240 214 230" fill="none" stroke="#2d3748" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- Tech Headset (Developer Vibe) -->
  <path d="M 132 170 C 130 115 155 80 200 80 C 245 80 270 115 268 170" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <rect x="126" y="165" width="14" height="35" rx="6" fill="#1e293b" stroke="url(#cyberCyan)" stroke-width="2"/>
  <rect x="260" y="165" width="14" height="35" rx="6" fill="#1e293b" stroke="url(#cyberCyan)" stroke-width="2"/>
  <!-- Microphone boom -->
  <path d="M 132 190 Q 130 225 160 225" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <circle cx="163" cy="225" r="4" fill="#00d2ff" filter="url(#glowFilter)"/>

  <!-- Outer Neon Rim Glow Highlight -->
  <path d="M 120 380 C 100 250 160 100 280 120" fill="none" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.35" filter="url(#glowFilter)"/>
</svg>
