<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="#0d121f" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#neonGlow)"/>
  
  <!-- Circuit lines decor -->
  <path d="M 40 30 L 40 60 L 60 80" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
  <path d="M 160 170 L 160 140 L 140 120" fill="none" stroke="#7928ca" stroke-width="2" opacity="0.4" stroke-dasharray="3,3"/>
  <circle cx="60" cy="80" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="140" cy="120" r="3" fill="#7928ca" opacity="0.6"/>

  <!-- Code Monogram JL -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 65 75 L 45 100 L 65 125" stroke="#00d2ff" />
    <!-- Letter J -->
    <path d="M 92 82 L 92 118 C 92 126 84 130 76 126" stroke="#ffffff" />
    <!-- Letter L -->
    <path d="M 108 82 L 108 124 L 126 124" stroke="url(#primaryGrad)" />
    <!-- Slash / -->
    <path d="M 140 75 L 128 125" stroke="#7928ca" stroke-width="8" opacity="0.7"/>
    <!-- Right Bracket > -->
    <path d="M 145 75 L 165 100 L 145 125" stroke="#00d2ff" />
  </g>
</svg>
